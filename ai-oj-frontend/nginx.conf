# WebSocket 升级头映射（本文件由 nginx 主配置在 http 块内 include）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # gzip 压缩
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff font/woff2;
    gzip_vary         on;

    # 静态资源长缓存（Vite 产物带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反向代理到网关（docker-compose 网络内服务名）
    location /api/ {
        proxy_pass         http://ai-oj-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 预留 WebSocket 升级（判题状态推送等）
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # WebSocket 反向代理到网关（判题进度 / 比赛时间实时推送）
    location /ws/ {
        proxy_pass         http://ai-oj-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA 回退入口禁止缓存：chunk 文件名带 hash，
    # 若 index.html 被缓存会引用已删除的旧 chunk 导致 MIME type 报错
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
