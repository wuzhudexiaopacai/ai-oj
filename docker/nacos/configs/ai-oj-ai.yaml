# AI-OJ 智能服务（Spring AI Alibaba / DashScope 原生协议）
# @author wuzhudexiaopacai
server:
  port: 9006

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/ai_oj_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  ai:
    # Spring AI Alibaba DashScope 接入（通义千问原生接口，非 OpenAI 兼容层）
    # 以下配置在 Nacos 中修改后由 @RefreshScope 自动重建模型，无需重启服务
    dashscope:
      base-url: https://dashscope.aliyuncs.com
      # 部署时通过环境变量覆盖：DASHSCOPE_API_KEY
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
          max-tokens: 2048

ai-oj:
  ai:
    # 每用户每分钟 AI 调用限流（Redisson RateLimiter）
    rate-limit-per-minute: 10
    # 会话记忆最大轮数（超出截断）
    max-memory-rounds: 20
  generate:
    # AI 出题专用参数：大 JSON（题面+用例+参考代码+题解）输出量大，
    # 全局 max-tokens(2048) 会截断导致 JsonEOFException，故单独放宽；
    # qwen-plus 稳定版最大输出仅 8192，出题长 JSON 仍可能超限，改用 qwen-plus-latest(16384)
    model: qwen-plus-latest
    max-tokens: 16384
    temperature: 0.7
