# AI-OJ 判题服务
# @author wuzhudexiaopacai
server:
  port: 9003

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/ai_oj_judge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root123456}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
  # Quartz 集群模式（JDBC 持久化，多实例共享调度，故障自动接管）
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: ai-oj-judge-scheduler
            instanceId: AUTO
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            isClustered: true
            clusterCheckinInterval: 10000
            useProperties: false
            misfireThreshold: 60000
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 8
            threadPriority: 5
            threadsInheritContextClassLoaderOfInitializingThread: true

ai-oj:
  judge:
    # 判题进度 Redis 过期时间（秒）
    progress-ttl-seconds: 3600
    # 同用户对同题最短提交间隔（秒），防重复提交
    submit-interval-seconds: 5
    # 允许提交的编程语言白名单（逗号分隔，需与沙箱 languages.toml 的 name 一致）
    supported-languages: c,cpp,java,python3,go,javascript,rust
    # 卡死任务扫描（Quartz Cron）：每分钟扫描超时仍未完成的提交
    stuck-scan-cron: "0 * * * * ?"
    # 判题结果 Outbox 补投（Quartz Cron）：默认每 20 秒扫描投递失败的待投递记录
    outbox-resend-cron: "0/20 * * * * ?"
    # 卡死判定阈值（秒）：超过该时间仍未完成的提交由扫描任务重新投递
    # 必须大于沙箱单次调用超时，避免仍在正常判题的提交被误判为卡死
    judge-timeout-seconds: 600
    # 沙箱单次调用超时（秒）：覆盖一次完整判题（编译 + 全部用例），与卡死阈值解耦
    sandbox-call-timeout-seconds: 300
    # 沙箱访问令牌（与沙箱 SANDBOX_API_TOKEN 保持一致），为空表示沙箱未开启校验
    sandbox-token: ${SANDBOX_API_TOKEN:}
    # 沙箱心跳：定时探测 /health 刷新 last_heartbeat
    sandbox:
      # 健康探测间隔（毫秒）
      heartbeat-interval-ms: 30000
      # 心跳有效期（秒），超过未刷新则不再参与调度
      stale-seconds: 90
