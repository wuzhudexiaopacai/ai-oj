# AI-OJ 比赛服务（Seata 分布式事务发起方）
# @author wuzhudexiaopacai
server:
  port: 9004

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/ai_oj_contest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

ai-oj:
  contest:
    # 排行榜缓存
    rank-ttl-seconds: 30
    # 比赛状态机扫描间隔（毫秒），驱动开赛/结束
    status-scan-interval-ms: 5000
