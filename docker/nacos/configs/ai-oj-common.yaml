# AI-OJ 公共配置（所有微服务共享）
# @author wuzhudexiaopacai
spring:
  cloud:
    nacos:
      # Nacos 3.x 默认开启鉴权（docker 环境已由 SPRING_CLOUD_NACOS_* 环境变量注入，此处兜底本地运行）
      username: ${SPRING_CLOUD_NACOS_USERNAME:nacos}
      password: ${SPRING_CLOUD_NACOS_PASSWORD:nacos}
    sentinel:
      # 启动即连接 Dashboard 并注册规则数据源，不等首次请求
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:sentinel-dashboard:8858}
        # 客户端与 Dashboard 通信端口（容器内独立，可固定端口便于排查）
        port: 8719
      # 流控规则持久化到 Nacos：在 Nacos 的 SENTINEL_GROUP 下维护 <应用名>-flow-rules，
      # 客户端监听变更实时热更新；Dashboard 仅用于实时监控与手动推送
      datasource:
        flow:
          nacos:
            server-addr: ${spring.cloud.nacos.server-addr:nacos:8848}
            username: ${spring.cloud.nacos.username:nacos}
            password: ${spring.cloud.nacos.password:nacos}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            rule-type: flow
    # Feign 超时：默认 connect 10s / read 60s 过长，远程服务抖动时会长占线程，
    # 拖慢并行远程读（用例文件、题目信息回填）与判题主链路，此处按接口体量分级收紧
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
          # 题目判题信息含全部用例与 SPJ 源码，体量较大
          problemFeignClient:
            read-timeout: 10000
          # 比赛成绩记录随参赛人数增长
          judgeFeignClient:
            read-timeout: 10000
          # 大用例文件内容（单文件上限 10MB）经 MinIO 读取，单独放宽
          fileFeignClient:
            read-timeout: 15000
  threads:
    virtual:
      # JDK21 虚拟线程全局开启（Web/Tomcat 与异步任务受益）
      enabled: true
  data:
    redis:
      host: redis
      port: 6379
      # 开发默认与 compose 中 redis --requirepass 保持一致，生产通过 REDIS_PASSWORD 注入
      password: ${REDIS_PASSWORD:redis123456}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 3000ms
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

rocketmq:
  name-server: rocketmq-namesrv:9876
  producer:
    group: ai-oj-producer-group
    # 同步发送 + 失败重试 2 次，保障核心链路可靠投递
    send-message-timeout: 5000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

minio:
  endpoint: http://minio:9000
  # 开发默认与 compose 中 MinIO 根凭据保持一致，生产通过环境变量注入
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
  bucket: ai-oj

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: ai-oj-tx-group
  service:
    vgroup-mapping:
      ai-oj-tx-group: default
    grouplist:
      default: seata-server:8091

ai-oj:
  jwt:
    # base64("ai-oj-secret-key-2026-wuzhudexiaopacai")，HS256 要求密钥 ≥ 32 字节
    secret: YWktb2otc2VjcmV0LWtleS0yMDI2LXd1emh1ZGV4aWFvcGFjYWk=
    expire-minutes: 720
  security:
    # 网关注入下游的信任令牌：业务服务校验通过后才采信 X-User-Id 等身份头，
    # 防止绕过网关直连业务端口伪造身份；生产通过 GATEWAY_TOKEN 注入，置空表示不校验（仅限本地调试）
    gateway-token: ${GATEWAY_TOKEN:ai-oj-gateway-token-2026}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    root: info
    com.github.wuzhudexiaopacai: debug
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"
