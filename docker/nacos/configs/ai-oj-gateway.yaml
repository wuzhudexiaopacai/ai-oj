# AI-OJ 网关配置
# @author wuzhudexiaopacai
server:
  port: 8080

spring:
  cloud:
    # 网关流控规则：按路由 ID / API 分组限流，规则持久化在 Nacos SENTINEL_GROUP
    sentinel:
      datasource:
        gw-flow:
          nacos:
            server-addr: ${spring.cloud.nacos.server-addr:nacos:8848}
            username: ${spring.cloud.nacos.username:nacos}
            password: ${spring.cloud.nacos.password:nacos}
            group-id: SENTINEL_GROUP
            data-id: ai-oj-gateway-gw-flow-rules
            rule-type: gw-flow
        gw-api-group:
          nacos:
            server-addr: ${spring.cloud.nacos.server-addr:nacos:8848}
            username: ${spring.cloud.nacos.username:nacos}
            password: ${spring.cloud.nacos.password:nacos}
            group-id: SENTINEL_GROUP
            data-id: ai-oj-gateway-gw-api-group-rules
            rule-type: gw-api-group
    gateway:
      default-filters:
        # 全链路响应头携带请求ID，便于排障
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: false
      routes:
        - id: ai-oj-auth
          uri: lb://ai-oj-auth
          predicates:
            - Path=/api/auth/**, /api/user/**, /api/admin/user/**, /api/admin/role/**, /api/admin/permission/**
          filters:
            - StripPrefix=1
        - id: ai-oj-problem
          uri: lb://ai-oj-problem
          predicates:
            - Path=/api/problem/**, /api/tag/**, /api/solution/**, /api/admin/problem/**
          filters:
            - StripPrefix=1
        - id: ai-oj-judge
          uri: lb://ai-oj-judge
          predicates:
            - Path=/api/judge/**, /api/submission/**, /api/admin/dead-letter/**, /api/admin/submission/**
          filters:
            - StripPrefix=1
        - id: ai-oj-contest
          uri: lb://ai-oj-contest
          predicates:
            - Path=/api/contest/**
          filters:
            - StripPrefix=1
        - id: ai-oj-file
          uri: lb://ai-oj-file
          predicates:
            - Path=/api/file/**
          filters:
            - StripPrefix=1
        - id: ai-oj-ai
          uri: lb://ai-oj-ai
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1
        - id: ai-oj-log
          uri: lb://ai-oj-log
          predicates:
            - Path=/api/admin/log/**
          filters:
            - StripPrefix=1
        # 比赛时间实时推送 WebSocket（按比赛维度，需排在通用 /ws/** 之前）
        - id: ai-oj-contest-ws
          uri: lb:ws://ai-oj-contest
          predicates:
            - Path=/ws/contest,/ws/contest/**
        # WebSocket 判题进度推送（不 strip 前缀）
        - id: ai-oj-judge-ws
          uri: lb:ws://ai-oj-judge
          predicates:
            - Path=/ws/**

# 网关白名单（无需 Token）
ai-oj:
  security:
    white-list:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/captcha
      - /api/auth/refresh
      # 题库/比赛为公开只读内容：未登录用户也可浏览（写操作仍由服务内部鉴权拦截）
      - /api/problem/**
      - /api/contest/**
      - /ws/**
      - /v3/api-docs/**
      - /doc.html
