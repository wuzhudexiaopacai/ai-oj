# RocketMQ Broker 配置
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
# 允许自动创建 Topic（开发环境开启，生产建议关闭并预建 Topic）
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true
# 容器网络内通信：向 namesrv 注册 broker 容器名
brokerIP1=rocketmq-broker
# 消息落盘策略：异步刷盘 + 同步复制关闭（单机）
flushDiskType=ASYNC_FLUSH
# 事务消息/延时消息支持
transactionCheckInterval=60000
# 延时等级（秒）：1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
messageDelayLevel=1s 5s 10s 30s 1m 2m 3m 4m 5m 6m 7m 8m 9m 10m 20m 30m 1h 2h
# 消费失败最大重试次数（超过进入死信队列 %DLQ%）
maxReconsumeTimes=3
listenPort=10911
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
storePathRootDir=/home/rocketmq/store
