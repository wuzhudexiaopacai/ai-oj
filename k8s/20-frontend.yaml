# 前端:nginx 静态资源 + /api/、/ws/、/files/ 反向代理(nginx.conf 已内置)
apiVersion: v1
kind: Service
metadata:
  name: ai-oj-frontend
  namespace: ai-oj
spec:
  type: NodePort
  selector:
    app: ai-oj-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-oj-frontend
  namespace: ai-oj
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-oj-frontend
  template:
    metadata:
      labels:
        app: ai-oj-frontend
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s02
      containers:
        - name: frontend
          image: docker.io/ai-oj/frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
