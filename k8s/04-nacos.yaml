# Nacos 2.4.3 standalone(Derby 存储,关闭鉴权,仅实验环境)
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: ai-oj
spec:
  selector:
    app: nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
    - name: grpc-client
      port: 9848
      targetPort: 9848
    - name: grpc-server
      port: 9849
      targetPort: 9849
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: ai-oj
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s02
      containers:
        - name: nacos
          image: docker.io/nacos/nacos-server:v2.4.3
          imagePullPolicy: IfNotPresent
          env:
            - name: MODE
              value: standalone
            - name: NACOS_AUTH_ENABLE
              value: "false"
            - name: NACOS_AUTH_TOKEN
              value: U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=
            - name: NACOS_AUTH_IDENTITY_KEY
              value: serverIdentity
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: security
            - name: JVM_XMS
              value: 256m
            - name: JVM_XMX
              value: 256m
            - name: JVM_XMN
              value: 128m
            - name: TZ
              value: Asia/Shanghai
          ports:
            - containerPort: 8848
              name: http
            - containerPort: 9848
              name: grpc-client
            - containerPort: 9849
              name: grpc-server
          volumeMounts:
            - name: data
              mountPath: /home/nacos/data
            - name: logs
              mountPath: /home/nacos/logs
          readinessProbe:
            httpGet:
              path: /nacos/v1/console/health/readiness
              port: 8848
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8848
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: data
          hostPath:
            path: /data/ai-oj/nacos
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /data/ai-oj/nacos-logs
            type: DirectoryOrCreate
