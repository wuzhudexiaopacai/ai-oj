# AI-OJ 8 个微服务:Deployment + ClusterIP Service
# 注册到 Nacos 的服务名(spring.application.name)与下方 Service 名一致,网关可按 lb://ai-oj-xxx 路由
# 节点分工:gateway/auth/problem/contest → k8s02;judge/file/ai/log → k8s03

# ============================ gateway ============================
apiVersion: v1
kind: Service
metadata:
  name: ai-oj-gateway
  namespace: ai-oj
spec:
  type: NodePort
  selector:
    app: ai-oj-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30088
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-oj-gateway
  namespace: ai-oj
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-oj-gateway
  template:
    metadata:
      labels:
        app: ai-oj-gateway
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s02
      containers:
        - name: gateway
          image: docker.io/ai-oj/gateway:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NACOS_ADDR
              value: nacos:8848
            - name: SPRING_CLOUD_NACOS_USERNAME
              value: nacos
            - name: SPRING_CLOUD_NACOS_PASSWORD
              value: nacos
            - name: TZ
              value: Asia/Shanghai
            - name: JAVA_OPTS
              value: "-Xms96m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 640Mi
---
