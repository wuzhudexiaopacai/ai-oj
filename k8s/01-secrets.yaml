# 敏感配置统一放 Secret。生产环境请用 SealedSecrets / External Secrets 管理。
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: ai-oj
type: Opaque
stringData:
  root-password: "root123456"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: ai-oj
type: Opaque
stringData:
  root-user: "minioadmin"
  root-password: "minioadmin123"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-secret
  namespace: ai-oj
type: Opaque
stringData:
  # 占位符:真实 Key 在项目根目录 .env(已 gitignore),部署前替换或部署后 patch Secret
  # 切勿把真实 Key 提交到仓库
  dashscope-api-key: "REPLACE_WITH_YOUR_DASHSCOPE_API_KEY"
