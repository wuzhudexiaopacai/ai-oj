# 语言配置：镜像由宿主预先拉取
# time_factor / memory_factor 为补偿系数（如 Java 启动开销大，给 2 倍时间）

[[languages]]
name = "c"
image = "gcc:13-bookworm"
source_file = "main.c"
compile_cmd = ["gcc", "-O2", "-std=c17", "-o", "main", "main.c", "-lm"]
run_cmd = ["./main"]
time_factor = 1.0
memory_factor = 1.0

[[languages]]
name = "cpp"
image = "gcc:13-bookworm"
source_file = "main.cpp"
compile_cmd = ["g++", "-O2", "-std=c++17", "-o", "main", "main.cpp"]
run_cmd = ["./main"]
time_factor = 1.0
memory_factor = 1.0

[[languages]]
name = "java"
image = "eclipse-temurin:21-jdk"
source_file = "Main.java"
compile_cmd = ["javac", "Main.java"]
run_cmd = ["java", "-Xmx256m", "Main"]
time_factor = 2.0
memory_factor = 2.0

[[languages]]
name = "python3"
image = "python:3.12-slim"
source_file = "main.py"
run_cmd = ["python3", "main.py"]
time_factor = 3.0
memory_factor = 1.0

[[languages]]
name = "go"
image = "golang:1.23-alpine"
source_file = "main.go"
compile_cmd = ["go", "build", "-o", "main", "main.go"]
run_cmd = ["./main"]
time_factor = 1.0
memory_factor = 1.0

[[languages]]
name = "javascript"
image = "node:20-alpine"
source_file = "main.js"
run_cmd = ["node", "main.js"]
time_factor = 2.0
memory_factor = 1.0

[[languages]]
name = "rust"
image = "rust:1.82-bookworm"
source_file = "main.rs"
compile_cmd = ["rustc", "-O", "-o", "main", "main.rs"]
run_cmd = ["./main"]
time_factor = 1.0
memory_factor = 1.0
