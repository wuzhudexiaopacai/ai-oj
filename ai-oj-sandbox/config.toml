# 沙箱服务配置
listen_addr = "0.0.0.0:8000"
# 最大并行评测任务数（线程池 max 语义）：并发打满时自动扩容到此上限
max_parallel = 4
# 常驻并行槽位（线程池 core 语义）：空闲时回落到该数量，不会低于 1
core_parallel = 2
# 排队等待槽位超时（秒）：超过后返回 503，交由判题端换机或退避重试
queue_timeout_secs = 60
# 空闲槽位回收间隔（秒）：每轮回收 1 个，直至回落到 core_parallel
shrink_interval_secs = 30
# 工作目录（容器内挂载 ai-oj-work volume 的路径）
work_dir = "/work"
# 子容器共享 volume 名称
work_volume = "ai-oj-work"
# 子容器名称前缀，用于启动时清理残留
container_prefix = "ai-oj-sandbox-"
# Docker 守护进程地址。compose 部署时指向 docker-socket-proxy，
# 避免把宿主 socket 直接暴露给沙箱；本地单机调试可用 unix:///var/run/docker.sock
docker_host = "unix:///var/run/docker.sock"
# HTTP 访问令牌（请求头 X-Sandbox-Token）。为空不校验，生产环境必须通过 SANDBOX_API_TOKEN 注入
api_token = ""
# 默认时间/内存限制
default_time_limit_ms = 2000
default_memory_limit_mb = 256
# 编译超时（秒）
compile_timeout_secs = 60
# 编译容器内存限制（MB）
compile_memory_mb = 512
# 输出读取上限（字节），超过判 OLE
output_limit_bytes = 16777216
# HTTP 请求体上限（字节），默认 64MB；超限请求在解析前即被拒绝
max_body_bytes = 67108864
# 任务目录保留时间（秒），到期异步清理
task_ttl_secs = 300
