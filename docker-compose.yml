# AI-OJ 全栈一键编排
# 注意：拉取镜像前请先在 Docker Desktop 配置国内镜像加速器（如 https://docker.1ms.run、https://docker.m.daocloud.io）
# 如需使用本地已有镜像，直接保持同名 tag 即可，compose 优先使用本地镜像

networks:
  ai-oj-net:
    driver: bridge
  # 沙箱与 docker-socket-proxy 专用网络：internal 禁止访问外网，缩小 socket 代理暴露面
  ai-oj-sandbox-net:
    driver: bridge
    internal: true

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  minio-data:
  es-data:
  ai-oj-work:
  rocketmq-data:
  filebeat-data:

# 微服务公共环境变量（Nacos 3.x 默认开启鉴权，默认账号 nacos/nacos）
x-app-env: &app-env
  NACOS_ADDR: nacos:8848
  SPRING_CLOUD_NACOS_USERNAME: nacos
  SPRING_CLOUD_NACOS_PASSWORD: nacos
  # 沙箱访问令牌（judge -> sandbox），空值表示不校验，生产环境必须注入
  SANDBOX_API_TOKEN: ${SANDBOX_API_TOKEN:-}
  # 容器默认 UTC 会让 LocalDateTime.now()/自动时间字段与比赛时间（东八区墙钟）错位 8 小时
  TZ: Asia/Shanghai

services:
  # ======================== 中间件层 ========================
  mysql:
    image: mysql:8.0.40
    container_name: ai-oj-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --lower_case_table_names=1
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ai-oj-net
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: ai-oj-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ai-oj-net
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: ai-oj-nacos
    environment:
      MODE: standalone
      # 开发环境使用内嵌 Derby 存储，免建库；生产切 MySQL 存储
      # 开发环境关闭鉴权：Nacos 2.x 内嵌 Derby 不自动初始化 nacos/nacos 用户，开启鉴权会导致控制台无法登录
      # 生产环境应切 MySQL 存储并开启鉴权
      NACOS_AUTH_ENABLE: "false"
      # Nacos 2.x 启动强制要求（即使关闭鉴权）：Base64 令牌 + 服务端身份标识
      NACOS_AUTH_TOKEN: U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 256m
      JVM_XMX: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - ai-oj-net
    restart: unless-stopped

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: ai-oj-rocketmq-namesrv
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-data:/home/rocketmq/logs
    networks:
      - ai-oj-net
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: ai-oj-rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - rocketmq-data:/home/rocketmq/logs
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    networks:
      - ai-oj-net
    restart: unless-stopped

  # RocketMQ 控制台（Dashboard）：查看 Topic / 消费组 / 消息轨迹等
  # 访问 http://localhost:18080（避开已占用的 80/8088/8848 等端口）
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: ai-oj-rocketmq-dashboard
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Xms256m -Xmx256m"
    ports:
      # 镜像内 Dashboard 默认监听 8082
      - "18080:8082"
    networks:
      - ai-oj-net
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: ai-oj-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - ai-oj-net
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: ai-oj-minio-init
    depends_on:
      - minio
    volumes:
      - ./docker/minio/init-bucket.sh:/init-bucket.sh:ro
    entrypoint: ["sh", "/init-bucket.sh"]
    networks:
      - ai-oj-net
    restart: "no"

  seata-server:
    image: apache/seata-server:2.3.0
    container_name: ai-oj-seata
    depends_on:
      - nacos
    environment:
      SEATA_PORT: "8091"
    ports:
      - "8091:8091"
      - "7091:7091"
    volumes:
      - ./docker/seata/application.yml:/seata-server/resources/application.yml:ro
    networks:
      - ai-oj-net
    restart: unless-stopped

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.8
    container_name: ai-oj-sentinel
    ports:
      - "8858:8858"
    networks:
      - ai-oj-net
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.21
    container_name: ai-oj-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms256m -Xmx256m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - ai-oj-net
    restart: unless-stopped

  # ======================== 统一日志（ELK） ========================
  # 采集全部容器 stdout/stderr -> Elasticsearch（ai-oj-logs-* 按天索引），Kibana 查询
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.19.21
    container_name: ai-oj-filebeat
    # 读取 docker.sock 与容器日志目录需要 root
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    depends_on:
      - elasticsearch
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # 记录采集位点，重启后从断点继续
      - filebeat-data:/usr/share/filebeat/data
    networks:
      - ai-oj-net
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.21
    container_name: ai-oj-kibana
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      # ES 已关闭安全认证，Kibana 同步关闭
      XPACK_SECURITY_ENABLED: "false"
      I18N_LOCALE: zh-CN
      # 限制 Node 堆，避免占满 Docker Desktop 内存
      NODE_OPTIONS: "--max-old-space-size=768"
    ports:
      - "5601:5601"
    networks:
      - ai-oj-net
    restart: unless-stopped

  # ======================== 评测沙箱（Rust） ========================
  # Docker socket 代理：沙箱不再直接挂载 /var/run/docker.sock（等价宿主 root），
  # 只允许容器相关接口的读写，镜像/卷/网络/exec 等危险接口全部拒绝
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: ai-oj-docker-proxy
    environment:
      CONTAINERS: "1"
      # 允许 POST（创建/启动/强杀容器），DELETE 也在该开关下放行
      POST: "1"
      IMAGES: "0"
      VOLUMES: "0"
      NETWORKS: "0"
      EXEC: "0"
      INFO: "0"
      SYSTEM: "0"
      LOG_LEVEL: "warning"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ai-oj-sandbox-net
    restart: unless-stopped

  ai-oj-sandbox:
    build: ./ai-oj-sandbox
    container_name: ai-oj-sandbox
    depends_on:
      - docker-socket-proxy
    environment:
      SANDBOX_LISTEN: 0.0.0.0:8000
      SANDBOX_MAX_PARALLEL: "4"
      SANDBOX_WORK_DIR: /work
      SANDBOX_WORK_VOLUME: ai-oj_ai-oj-work
      SANDBOX_DOCKER_HOST: tcp://docker-socket-proxy:2375
      # 与判题服务共享的访问令牌（生产环境务必通过宿主机 .env 注入非空值）
      SANDBOX_API_TOKEN: ${SANDBOX_API_TOKEN:-}
    # 不发布端口：仅 ai-oj-net 内的 judge 可通过容器名 ai-oj-sandbox:8000 访问
    volumes:
      - ai-oj-work:/work
    networks:
      - ai-oj-net
      - ai-oj-sandbox-net
    restart: unless-stopped

  # ======================== 微服务层 ========================
  ai-oj-gateway:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        MODULE: ai-oj-gateway
    container_name: ai-oj-gateway
    depends_on:
      - nacos
    environment: *app-env
    ports:
      # 宿主端口避让 Nacos 3.x 控制台 8080；容器内仍为 8080，前端经网关容器名访问不受影响
      - "8088:8080"
    networks:
      - ai-oj-net
    restart: unless-stopped

  ai-oj-auth:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        MODULE: ai-oj-auth
    container_name: ai-oj-auth
    depends_on:
      - nacos
      - mysql
      - redis
    environment: *app-env
    ports:
      # 宿主 9001 已被 MinIO 控制台占用，映射到 19001；服务间通信仍走容器名 auth:9001
      - "19001:9001"
    networks:
      - ai-oj-net
    restart: unless-stopped

  ai-oj-problem:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        MODULE: ai-oj-problem
    container_name: ai-oj-problem
    depends_on:
      - nacos
      - mysql
      - redis
    environment: *app-env
    ports:
      - "9002:9002"
    networks:
      - ai-oj-net
    restart: unless-stopped

  ai-oj-judge:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        MODULE: ai-oj-judge
    container_name: ai-oj-judge
    depends_on:
      - nacos
      - mysql
      - redis
      - rocketmq-broker
      - ai-oj-sandbox
    environment: *app-env
    ports:
      - "9003:9003"
    networks:
      - ai-oj-net
    restart: unless-stopped

  ai-oj-contest:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        MODULE: ai-oj-contest
    container_name: ai-oj-contest
    depends_on:
      - nacos
      - mysql
      - redis
      - seata-server
    environment: *app-env
    ports:
      - "9004:9004"
    networks:
      - ai-oj-net
    restart: unless-stopped

  ai-oj-file:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        MODULE: ai-oj-file
    container_name: ai-oj-file
    depends_on:
      - nacos
      - mysql
      - redis
      - minio
    environment: *app-env
    ports:
      - "9005:9005"
    networks:
      - ai-oj-net
    restart: unless-stopped

  ai-oj-ai:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        MODULE: ai-oj-ai
    container_name: ai-oj-ai
    depends_on:
      - nacos
      - mysql
      - redis
    environment:
      <<: *app-env
      # DashScope 密钥由宿主机 .env 注入（不入库、不提交仓库），Nacos 中仅引用 ${DASHSCOPE_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
    ports:
      - "9006:9006"
    networks:
      - ai-oj-net
    restart: unless-stopped

  ai-oj-log:
    build:
      context: .
      dockerfile: docker/runtime.Dockerfile
      args:
        MODULE: ai-oj-log
    container_name: ai-oj-log
    depends_on:
      - nacos
      - mysql
      - redis
      - rocketmq-broker
    environment: *app-env
    ports:
      - "9007:9007"
    networks:
      - ai-oj-net
    restart: unless-stopped

  # ======================== 前端 ========================
  ai-oj-frontend:
    build: ./ai-oj-frontend
    container_name: ai-oj-frontend
    depends_on:
      - ai-oj-gateway
    ports:
      - "80:80"
    networks:
      - ai-oj-net
    restart: unless-stopped
