spring:
  application:
    name: ai-oj-file
  profiles:
    active: docker
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:nacos:8848}
      discovery:
        group: DEFAULT_GROUP
        namespace: ""
      config:
        group: DEFAULT_GROUP
        namespace: ""
        file-extension: yaml
  config:
    import:
      - nacos:ai-oj-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - nacos:ai-oj-file.yaml?group=DEFAULT_GROUP&refreshEnabled=true
